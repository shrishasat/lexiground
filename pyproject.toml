[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "lexiground"
version = "0.1.0"

description = "Lexical iconicity and sensorimotor norm lookup and estimation using SBERT embeddings."

readme = "README.md"

requires-python = ">=3.10"

authors = [
    { name = "Shrisha Sathishkumar" }
]

license = { text = "MIT" }

keywords = [
    "lexical semantics",
    "sensorimotor norms",
    "iconicity",
    "word embeddings",
    "SBERT",
    "psycholinguistics",
    "computational neuroscience",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "joblib",
    "platformdirs>=4.0",
]


[project.optional-dependencies]

sbert = [
    "sentence-transformers",
]

glove = [
    "gensim",
]

fasttext = [
    "fasttext",
]

all = [
    "sentence-transformers",
    "gensim",
    "fasttext",
]

dev = [
    "pytest",
    "ruff",
]


[project.urls]
Homepage = "https://github.com/shrishasat/lexiground"
Repository = "https://github.com/shrishasat/lexiground"
Issues = "https://github.com/shrishasat/lexiground/issues"


[tool.setuptools.packages.find]
where = ["src"]
